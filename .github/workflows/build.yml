name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CACHE_VERSION: 15
  CIBUILD: true
  DEBIAN_FRONTEND: noninteractive
  PAWPAW_CI: 1
  PAWPAW_FAST_MATH: 1
  PAWPAW_SKIP_GLIB: 1
  PAWPAW_SKIP_LTO: 1
  PAWPAW_SKIP_LV2: 1
  PAWPAW_SKIP_OPENSSL: 1
  PAWPAW_SKIP_SAMPLERATE: 1
  PAWPAW_SKIP_TESTS: 1

jobs:
  wasm:
    runs-on: ubuntu-22.04
    steps:
      - name: Use GitHub mirrors for flaky submodule hosts
        run: |
          git config --global url."https://github.com/xiph/speexdsp".insteadOf "https://gitlab.xiph.org/xiph/speexdsp"
          git config --global url."https://github.com/xiph/speexdsp.git".insteadOf "https://gitlab.xiph.org/xiph/speexdsp.git"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/PawPawBuilds
            src/Rack/dep/bin
            src/Rack/dep/include
            src/Rack/dep/lib
            src/Rack/dep/share
            src/Rack/dep/jansson-2.12
            src/Rack/dep/libarchive-3.4.3
            src/Rack/dep/libsamplerate-0.1.9
            src/Rack/dep/zstd-1.4.5
          key: wasm-simd-v${{ env.CACHE_VERSION }}
      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq gperf meson
      - name: Build extra dependencies
        run: |
          ./deps/PawPaw/bootstrap-cardinal.sh wasm
          ./deps/PawPaw/.cleanup.sh wasm
      - name: Build CardinalMini
        shell: bash
        run: |
          source deps/PawPaw/local.env wasm
          # Keep the upstream Surge workaround for Emscripten.
          sed -i -e 's/defined(__riscv)/defined(__riscv) || defined(__EMSCRIPTEN__)/' plugins/surgext/surge/src/common/globals.h
          make -j "$(nproc)" HAVE_LIBLO=false NOOPT=true NOSIMD=false mini
          for ext in html js wasm data; do
            test -s "bin/CardinalMini.$ext"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: CardinalMini-wasm-simd
          if-no-files-found: error
          path: |
            bin/CardinalMini.html
            bin/CardinalMini.js
            bin/CardinalMini.wasm
            bin/CardinalMini.data
